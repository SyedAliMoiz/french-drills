<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Drills — Chapitre 1</title>
<meta name="theme-color" content="#3B82F6">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
<style>
:root {
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --text: #1A1A1A;
  --text-dim: #6B6B6B;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-on: #FFFFFF;
  --accent-faint: #EFF4FF;
  --ok: #16A34A;
  --ok-bg: #E8F5E9;
  --ok-border: #86E8AB;
  --err: #DC2626;
  --err-bg: #FEF2F2;
  --err-border: #FECACA;
  --warn: #D97706;
  --warn-bg: #FFFBEB;
  --warn-border: #FDE68A;
  --line: #E5E5E5;
  --field-bg: #FFFFFF;
  --field-border: #D4D4D4;
  --field-focus: #2563EB;
  --key-bg: #F5F5F5;
  --key-hover: #E5E5E5;
  --key-border: #D4D4D4;
  --key-text: #1A1A1A;
  --bar-track: #E5E5E5;
  --bar-fill: #2563EB;
  --card-shadow: 0 1px 3px rgba(0,0,0,0.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#191919;--surface:#262626;--text:#F2F2F2;--text-dim:#8A8A8A;
  --accent:#3B82F6;--accent-hover:#60A5FA;--accent-on:#FFFFFF;--accent-faint:#1E293B;
  --ok:#4ADE80;--ok-bg:#14291E;--ok-border:#166534;
  --err:#F87171;--err-bg:#2D1515;--err-border:#7F1D1D;
  --warn:#FBBF24;--warn-bg:#2D2410;--warn-border:#854D0E;
  --line:#333333;--field-bg:#1F1F1F;--field-border:#404040;--field-focus:#3B82F6;
  --key-bg:#2A2A2A;--key-hover:#363636;--key-border:#404040;--key-text:#D4D4D4;
  --bar-track:#333333;--bar-fill:#3B82F6;--card-shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#191919;--surface:#262626;--text:#F2F2F2;--text-dim:#8A8A8A;
  --accent:#3B82F6;--accent-hover:#60A5FA;--accent-on:#FFFFFF;--accent-faint:#1E293B;
  --ok:#4ADE80;--ok-bg:#14291E;--ok-border:#166534;
  --err:#F87171;--err-bg:#2D1515;--err-border:#7F1D1D;
  --warn:#FBBF24;--warn-bg:#2D2410;--warn-border:#854D0E;
  --line:#333333;--field-bg:#1F1F1F;--field-border:#404040;--field-focus:#3B82F6;
  --key-bg:#2A2A2A;--key-hover:#363636;--key-border:#404040;--key-text:#D4D4D4;
  --bar-track:#333333;--bar-fill:#3B82F6;--card-shadow:none;
}
:root[data-theme="light"]{
  --bg:#FAFAFA;--surface:#FFFFFF;--text:#1A1A1A;--text-dim:#6B6B6B;
  --accent:#2563EB;--accent-hover:#1D4ED8;--accent-on:#FFFFFF;--accent-faint:#EFF4FF;
  --ok:#16A34A;--ok-bg:#E8F5E9;--ok-border:#86E8AB;
  --err:#DC2626;--err-bg:#FEF2F2;--err-border:#FECACA;
  --warn:#D97706;--warn-bg:#FFFBEB;--warn-border:#FDE68A;
  --line:#E5E5E5;--field-bg:#FFFFFF;--field-border:#D4D4D4;--field-focus:#2563EB;
  --key-bg:#F5F5F5;--key-hover:#E5E5E5;--key-border:#D4D4D4;--key-text:#1A1A1A;
  --bar-track:#E5E5E5;--bar-fill:#2563EB;--card-shadow:0 1px 3px rgba(0,0,0,0.06);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:1.25rem 1rem}

/* Typography */
.serif{font-family:Georgia,"Times New Roman",serif}
.hdr{font-size:1.375rem;font-weight:700;letter-spacing:-0.01em}
.sub{font-size:.8125rem;color:var(--text-dim)}
.label{font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}
.tabnum{font-variant-numeric:tabular-nums}

/* Progress bar */
.prog-track{height:4px;background:var(--bar-track);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--bar-fill);border-radius:2px;transition:width .35s ease}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem;box-shadow:var(--card-shadow);margin-bottom:.75rem}
.card-accent{border-left:3px solid var(--accent)}
.card-ok{border-left-color:var(--ok)}
.card-err{border-left-color:var(--err)}
.card-title{font-weight:600;margin-bottom:.25rem}
.card-sub{font-size:.8125rem;color:var(--text-dim)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;font-family:inherit;font-size:1rem;font-weight:600;padding:.75rem 1.5rem;border:none;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-p{background:var(--accent);color:var(--accent-on)}
.btn-p:hover:not(:disabled){background:var(--accent-hover)}
.btn-g{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-g:hover:not(:disabled){background:var(--accent-faint)}
.btn-sm{font-size:.875rem;padding:.5rem 1rem}
.btn-ok{background:var(--ok);color:#fff}
.btn-link{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:.5rem;font-size:.875rem;text-decoration:underline;text-underline-offset:2px}

/* Fields */
.field{width:100%;font-family:Georgia,"Times New Roman",serif;font-size:1.125rem;padding:.75rem;background:var(--field-bg);color:var(--text);border:1.5px solid var(--field-border);border-radius:6px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--field-focus)}
.field:disabled{opacity:.6;cursor:not-allowed}
.field-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.field-err{border-color:var(--err)!important;background:var(--err-bg)!important}
.field-pw{font-family:inherit;font-size:1rem}

/* Accent keys */
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:.625rem 0}
.key{font-family:Georgia,serif;font-size:1rem;min-width:38px;height:36px;display:flex;align-items:center;justify-content:center;padding:0 4px;background:var(--key-bg);color:var(--key-text);border:1px solid var(--key-border);border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .1s,transform .08s}
.key:hover{background:var(--key-hover)}
.key:active{transform:scale(.93)}
.key:disabled{opacity:.3;pointer-events:none}

/* MCQ options */
.opts{display:flex;flex-direction:column;gap:.5rem;margin:.75rem 0}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;padding:.875rem 1rem;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-family:Georgia,serif;font-size:1.0625rem;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .15s,background .15s}
.opt:hover:not(.opt-locked){border-color:var(--accent);background:var(--accent-faint)}
.opt-letter{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent-faint);color:var(--accent);font-family:system-ui,sans-serif;font-size:.8125rem;font-weight:700;flex-shrink:0}
.opt-locked{cursor:default;opacity:.5}
.opt-sel{border-color:var(--accent);background:var(--accent-faint)}
.opt-right{border-color:var(--ok)!important;background:var(--ok-bg)!important;opacity:1!important}
.opt-right .opt-letter{background:var(--ok);color:#fff}
.opt-wrong{border-color:var(--err)!important;background:var(--err-bg)!important;opacity:1!important}
.opt-wrong .opt-letter{background:var(--err);color:#fff}

/* Feedback */
.fb{padding:.875rem;border-radius:6px;font-size:.9375rem;line-height:1.5;margin-top:.75rem}
.fb-ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok)}
.fb-err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err)}
.fb-warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn)}
.fb-head{font-weight:700;display:block;margin-bottom:.2rem}
.fb-rule{display:block;margin-top:.35rem;font-size:.8125rem;opacity:.85}
.fb-answer{font-family:Georgia,serif;font-weight:600}

/* Layout helpers */
.row{display:flex;align-items:center;gap:.75rem}
.col{display:flex;flex-direction:column;gap:.75rem}
.mt{margin-top:1rem}.mt-sm{margin-top:.5rem}.mb{margin-bottom:1rem}
.gap-sm{gap:.5rem}
.center{text-align:center}
.between{justify-content:space-between}
.flex1{flex:1}

/* Dashboard */
.dash-section{margin-bottom:1.25rem}
.dash-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.5rem;padding-left:.25rem}
.stat-row{display:flex;gap:.5rem;flex-wrap:wrap}
.stat-box{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.75rem;text-align:center}
.stat-val{font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.stat-label{font-size:.6875rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:.125rem}
.due-badge{display:inline-block;font-size:.6875rem;font-weight:600;padding:.125rem .5rem;border-radius:99px;background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}
.overdue{color:var(--err)}

/* Results */
.res-score{font-family:Georgia,serif;font-size:3rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.res-msg{font-size:1.125rem;color:var(--text-dim);margin-bottom:1.5rem}
.res-list{list-style:none}
.res-item{display:flex;align-items:flex-start;gap:.625rem;padding:.625rem 0;border-bottom:1px solid var(--line);font-size:.9375rem}
.res-item:last-child{border-bottom:none}
.res-icon{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-top:2px}
.ico-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
.ico-err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}
.res-yours{text-decoration:line-through;color:var(--err);font-size:.8125rem;margin-top:.125rem}

/* Spinner */
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sync indicator */
.sync{display:flex;align-items:center;gap:.375rem;font-size:.75rem;color:var(--text-dim);padding:.375rem .75rem;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.sync-ok{color:var(--ok);border-color:var(--ok-border)}
.sync-err{color:var(--err);border-color:var(--err-border)}

/* Auth screens */
.auth-logo{font-size:2rem;margin-bottom:.25rem}
.auth-title{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;margin-bottom:.25rem}
.auth-sub{color:var(--text-dim);font-size:.875rem;margin-bottom:1.5rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8125rem;font-weight:600;margin-bottom:.375rem;color:var(--text-dim)}
.form-help{font-size:.75rem;color:var(--text-dim);margin-top:.25rem}
.error-msg{color:var(--err);font-size:.875rem;font-weight:500;margin-bottom:.75rem}
.checkbox-row{display:flex;align-items:center;gap:.5rem;font-size:.875rem;margin:.75rem 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.checkbox-row input{width:18px;height:18px;accent-color:var(--accent)}

/* Section progress list */
.sec-list{list-style:none}
.sec-item{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.875rem}
.sec-item:last-child{border-bottom:none}
.sec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sec-dot-locked{background:var(--ok)}
.sec-dot-learning{background:var(--warn)}
.sec-dot-none{background:var(--line)}
.sec-name{flex:1}
.sec-status{font-size:.75rem;color:var(--text-dim)}

/* Drill page — fills viewport, no card, soft shapes */
.dp{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.dp-top{padding:1rem 1.25rem 0;width:100%;max-width:800px;margin:0 auto}
.dp-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.5rem 1.25rem 2rem;width:100%;max-width:800px;margin:0 auto;gap:.5rem}
.dp .card{background:transparent;border:none;box-shadow:none;padding:0;border-radius:0;border-left:none;margin:0}
.dp .card.card-ok{background:var(--ok-bg);border-radius:24px;padding:1.5rem;margin:-.5rem;margin-bottom:0}
.dp .card.card-err{background:var(--err-bg);border-radius:24px;padding:1.5rem;margin:-.5rem;margin-bottom:0}
.dp .serif{font-size:1.75rem;line-height:1.45;color:#F2F2F2;font-weight:700}
.dp .sub{font-size:1.375rem;line-height:1.5;margin-top:.75rem;color:#CCCCCC;font-weight:500}
@media(prefers-color-scheme:light){.dp .serif{color:#1A1A1A}.dp .sub{color:#555}}
:root[data-theme="light"] .dp .serif{color:#1A1A1A}
:root[data-theme="light"] .dp .sub{color:#555}
.dp .field{font-size:clamp(1.25rem,3vw,1.5rem);padding:1.125rem 1.25rem;border-radius:18px;margin-top:1.25rem}
.dp .keys{gap:10px;margin:.75rem 0;justify-content:center}
.dp .key{min-width:48px;height:48px;font-size:1.25rem;border-radius:14px}
.dp .keys-toggle{background:none;border:none;color:var(--text-dim);font-size:.875rem;cursor:pointer;padding:.5rem;margin-top:.5rem;-webkit-tap-highlight-color:transparent}
.dp .keys-toggle:hover{color:var(--text)}
.dp .btn{padding:1.125rem;font-size:clamp(1.0625rem,2.5vw,1.25rem);border-radius:50px}
.dp .opts{gap:.875rem;margin-top:1.5rem}
.dp .opt{padding:1.25rem 1.375rem;font-size:clamp(1.125rem,2.8vw,1.375rem);border-radius:20px;border-width:1.5px;background:var(--surface)}
.dp .opt:hover:not(.opt-locked){background:var(--accent-faint)}
.dp .opt-right{border-radius:20px!important}
.dp .opt-wrong{border-radius:20px!important}
.dp .opt-letter{width:36px;height:36px;font-size:.9375rem;border-radius:50%}
.dp .fb{padding:1.25rem 1.375rem;border-radius:20px;font-size:clamp(1rem,2.5vw,1.1875rem);margin-top:1.5rem}
.dp .fb-head{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .fb-rule{font-size:clamp(.9375rem,2.2vw,1.0625rem);line-height:1.55}
.dp .fb-answer{font-size:clamp(1.0625rem,2.5vw,1.25rem)}
.dp .prog-track{height:3px;border-radius:2px}
.dp-count{font-size:.875rem;color:var(--text-dim);font-variant-numeric:tabular-nums}

/* Animations */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}
.shake{animation:shake .35s ease}
.pop{animation:pop .3s ease}
@media(prefers-reduced-motion:reduce){.shake,.pop{animation:none}.prog-fill{transition:none}.spin{animation-duration:1.2s}}

/* HW Mode */
.hw-prog{display:flex;align-items:center;gap:.5rem;justify-content:center;margin-top:.375rem}
.hw-prog-dots{display:flex;gap:4px}
.hw-prog-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.hw-prog-dot.done{background:var(--ok)}
.hw-prog-dot.active{background:var(--accent)}
.hw-entry-section{margin-bottom:1.25rem}
.hw-entry-label{font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:.75rem}
.hw-word-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.75rem}
.hw-word-num{font-size:.875rem;font-weight:700;color:var(--text-dim);min-width:1.5rem}
.hw-word-field{flex:1}
.hw-gender-btns{display:flex;gap:0;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.hw-gender-btn{padding:.5rem .75rem;font-size:.875rem;font-weight:600;background:var(--surface);color:var(--text-dim);border:none;cursor:pointer;transition:all .15s}
.hw-gender-btn.active{background:var(--accent);color:var(--accent-on)}
.hw-gender-btn:first-child{border-right:1px solid var(--line)}
.conj-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem}
.conj-label{font-weight:600;font-size:1rem;min-width:5.5rem;text-align:right;color:var(--text-dim);font-family:Georgia,"Times New Roman",serif}
.conj-input{flex:1}
.conj-result{display:flex;align-items:center;gap:.5rem;margin-top:.25rem;font-size:.875rem}
.conj-correct{color:var(--ok);font-weight:600}
.conj-wrong{color:var(--err)}
.conj-answer{font-weight:600;font-family:Georgia,serif}
.hw-form-row{margin-bottom:1rem}
.hw-form-label{font-size:.875rem;font-weight:600;color:var(--text-dim);margin-bottom:.375rem;display:block}
.hw-summary-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.75rem}
.hw-summary-word{font-family:Georgia,serif;font-weight:700;font-size:1.125rem;margin-bottom:.5rem}
.hw-summary-row{display:flex;justify-content:space-between;font-size:.875rem;padding:.25rem 0;border-bottom:1px solid var(--line)}
.hw-summary-row:last-child{border-bottom:none}
.streak-badge{display:inline-flex;align-items:center;gap:.375rem;font-size:.875rem;font-weight:700;color:var(--warn);padding:.25rem .75rem;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:99px}
.hw-history{margin-top:1rem;text-align:left;width:100%}
.hw-history-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:.5rem}
.hw-history-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem .75rem;border-bottom:1px solid var(--line);font-size:.875rem}
.hw-history-row:last-child{border-bottom:none}
.hw-history-date{color:var(--text-dim)}
.hw-history-score{font-weight:700;font-variant-numeric:tabular-nums}
.hw-history-bar{flex:1;margin:0 .75rem;height:4px;background:var(--bar-track);border-radius:2px;overflow:hidden}
.hw-history-fill{height:100%;border-radius:2px}
</style>
</head>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   CONFIGURATION
   ═══════════════════════════════════════════════════════════════ */

const CFG = { owner: 'syedalimoiz', repo: 'french-drills' };
const ACCENTS = ['é','è','ê','ë','à','â','î','ï','ô','ù','û','ç'];
const SECTION_META = {
  's1-gender':     { title: 'Gender + Articles (le/la)', ch: 1, order: 1 },
  's2a-elision':   { title: "Elision (l')", ch: 1, order: 2 },
  's2b-indefinite':{ title: 'Indefinite Articles (un/une)', ch: 1, order: 3 },
  's3-plurals':    { title: 'Plural Nouns (6 rules)', ch: 1, order: 4 },
  's4r1-position': { title: 'Adjective Position', ch: 1, order: 5 },
  's4r2-fem-basic':{ title: 'Feminine Adjectives (+e)', ch: 1, order: 6 },
  's4r3-fem-irreg':{ title: 'Irregular Feminine (4 patterns)', ch: 1, order: 7 },
  's4r4-plural-adj':{ title: 'Plural Adjectives', ch: 1, order: 8 },
  'compound':      { title: 'Compound (Multi-Rule)', ch: 1, order: 8.5 },
  's4b-colors':    { title: 'Colors', ch: 1, order: 9 },
  's4c-precede':   { title: 'Precede-the-Noun (beau/nouveau)', ch: 1, order: 10 },
  's5-vocab':      { title: 'Key Vocabulary', ch: 1, order: 11 },
};

/* ═══════════════════════════════════════════════════════════════
   QUESTION BANK — loaded from data/chapter1.js (CHAPTER_1)
   Flattened at runtime with normalized section IDs.
   ═══════════════════════════════════════════════════════════════ */

const SECTION_ID_MAP = {
  's4r1-adj-position': 's4r1-position',
  's4r2-fem-adj-basic': 's4r2-fem-basic',
  's4r3-fem-adj-irregular': 's4r3-fem-irreg',
};

const QUESTIONS = (function() {
  const qs = [];
  const counters = {};
  const addQ = (sid, q) => {
    counters[sid] = counters[sid] || {};
    const t = q.type;
    counters[sid][t] = (counters[sid][t] || 0) + 1;
    qs.push({ ...q, id: `${sid}-${t[0]}${counters[sid][t]}`, section: sid });
  };
  if (typeof CHAPTER_1 !== 'undefined') {
    for (const sec of CHAPTER_1.sections) {
      const sid = SECTION_ID_MAP[sec.id] || sec.id;
      for (const q of sec.questions) addQ(sid, q);
    }
  }
  if (typeof ADDITIONAL_QUESTIONS !== 'undefined') {
    const TAG_TO_SECTION = { 's1-gender':'s1-gender', 's3-plurals':'s3-plurals', 'compound':'compound', 'reduced-hint':'compound', 's4b-colors':'s4b-colors', 's4c-precede':'s4c-precede', 's5-vocab':'s5-vocab' };
    for (const q of ADDITIONAL_QUESTIONS) {
      const sid = (q.tags || []).reduce((found, t) => found || TAG_TO_SECTION[t], null) || 'compound';
      addQ(sid, q);
    }
  }
  return qs;
})();


/* ═══════════════════════════════════════════════════════════════
   CRYPTO — AES-256-GCM password encryption for PAT
   ═══════════════════════════════════════════════════════════════ */

const Cry = {
  async deriveKey(pw, salt) {
    const raw = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' },
      raw,
      { name:'AES-GCM', length:256 },
      false,
      ['encrypt','decrypt']
    );
  },
  async encrypt(pw, text) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.deriveKey(pw, salt);
    const enc = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return { s: this.b64(salt), i: this.b64(iv), d: this.b64(new Uint8Array(enc)) };
  },
  async decrypt(pw, bundle) {
    const salt = this.unb64(bundle.s), iv = this.unb64(bundle.i), data = this.unb64(bundle.d);
    const key = await this.deriveKey(pw, salt);
    const dec = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(dec);
  },
  b64(u8) { return btoa(String.fromCharCode(...u8)); },
  unb64(s) { return new Uint8Array(atob(s).split('').map(c=>c.charCodeAt(0))); }
};


/* ═══════════════════════════════════════════════════════════════
   GITHUB API — Read/write files to the repo
   ═══════════════════════════════════════════════════════════════ */

class GH {
  constructor(token) {
    this.token = token;
    this.api = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents`;
    this.shas = {};
  }
  headers() {
    const h = { 'Accept':'application/vnd.github.v3+json' };
    if (this.token) h['Authorization'] = `Bearer ${this.token}`;
    return h;
  }
  async get(path) {
    const r = await fetch(`${this.api}/${path}`, { headers: this.headers() });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.json()).message}`);
    const d = await r.json();
    this.shas[path] = d.sha;
    const bin = atob(d.content.replace(/\n/g, ''));
    return new TextDecoder().decode(new Uint8Array([...bin].map(c=>c.charCodeAt(0))));
  }
  async put(path, content, msg) {
    const bytes = new TextEncoder().encode(content);
    const b64 = btoa(String.fromCharCode(...bytes));
    const body = { message: msg, content: b64 };
    if (this.shas[path]) body.sha = this.shas[path];
    const r = await fetch(`${this.api}/${path}`, {
      method: 'PUT',
      headers: { ...this.headers(), 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      const e = await r.json();
      if (r.status === 409 && !this.shas[path]) {
        await this.get(path);
        return this.put(path, content, msg);
      }
      throw new Error(`GitHub ${r.status}: ${e.message}`);
    }
    const d = await r.json();
    this.shas[path] = d.content.sha;
  }
}

function migrateProgress(prog) {
  const defaults = defaultProgress();
  for (const [id, sec] of Object.entries(defaults.sections)) {
    if (!prog.sections[id]) {
      prog.sections[id] = sec;
    } else if (prog.sections[id].status === 'not-started' && sec.status === 'learning') {
      prog.sections[id].status = 'learning';
    }
  }
  return prog;
}

function masteryPct() {
  const total = QUESTIONS.filter(q => {
    const sec = S.progress.sections[q.section];
    return sec && (sec.status === 'locked' || sec.status === 'learning');
  }).length;
  if (!total) return 0;
  const a = S.progress.answered || {};
  let correct = 0;
  for (const q of QUESTIONS) {
    const rec = a[q.id];
    if (rec && rec.attempts && rec.attempts.length > 0 && rec.attempts[rec.attempts.length - 1].ok) correct++;
  }
  return Math.round((correct / total) * 100);
}


/* ═══════════════════════════════════════════════════════════════
   DRILL ENGINE
   ═══════════════════════════════════════════════════════════════ */

const Engine = {
  getDue(progress) {
    const now = Date.now(), due = [];
    for (const [id, s] of Object.entries(progress.sections)) {
      if (s.status !== 'locked') continue;
      if (!s.lastReview) { due.push({ id, days: 999, pri: 'high' }); continue; }
      const days = Math.floor((now - new Date(s.lastReview).getTime()) / 86400000);
      const interval = [1,3,7,14,30,60][Math.min(s.reviews, 5)];
      if (days >= interval) due.push({ id, days, pri: days > interval*2 ? 'high' : 'medium' });
    }
    return due.sort((a,b) => b.days - a.days);
  },

  getCurrent(progress) {
    for (const [id, s] of Object.entries(progress.sections)) {
      if (s.status === 'learning') return id;
    }
    return null;
  },

  pickQuestions(sectionIds, type, count) {
    let pool = QUESTIONS.filter(q => sectionIds.includes(q.section) && q.type === type);
    this.shuffle(pool);
    return pool.slice(0, count);
  },

  buildReviewDrill(dueIds, count) {
    let pool = QUESTIONS.filter(q => dueIds.includes(q.section) && (q.type === 'mcq' || q.type === 'why'));
    this.shuffle(pool);
    const perSection = Math.max(2, Math.ceil(count / dueIds.length));
    const picked = [];
    const used = new Set();
    for (const sid of dueIds) {
      const sqs = pool.filter(q => q.section === sid && !used.has(q.id));
      sqs.slice(0, perSection).forEach(q => { picked.push(q); used.add(q.id); });
    }
    this.shuffle(picked);
    return picked.slice(0, count);
  },

  buildLearningDrill(sectionId) {
    const mcqs = QUESTIONS.filter(q => q.section === sectionId && q.type === 'mcq');
    const whys = QUESTIONS.filter(q => q.section === sectionId && q.type === 'why');
    this.shuffle(mcqs);
    this.shuffle(whys);
    return [...mcqs.slice(0, 6), ...whys.slice(0, 2)];
  },

  buildMixedDrill(progress, count) {
    const available = Object.entries(progress.sections)
      .filter(([,s]) => s.status === 'locked' || s.status === 'learning')
      .map(([id]) => id);
    let pool = QUESTIONS.filter(q => available.includes(q.section) && q.type === 'mcq');
    this.shuffle(pool);
    return pool.slice(0, count);
  },

  check(q, answer) {
    if (q.type === 'mcq' || q.type === 'why') return answer === q.correct;
    const norm = s => s.trim().normalize('NFC').replace(/[''ʼ`′]/g,"'").replace(/\s+/g,' ').replace(/[.!?,;…]+$/,'').toLowerCase();
    const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
    const match = (a, b) => a === b || strip(a) === strip(b);
    const n = norm(answer);
    if (match(n, norm(q.correct))) return true;
    if (q.alternates) return q.alternates.some(a => match(n, norm(a)));
    return false;
  },

  shuffle(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
};


/* ═══════════════════════════════════════════════════════════════
   FRENCH LANGUAGE ENGINE — conjugation, plurals, agreement
   ═══════════════════════════════════════════════════════════════ */

const PRONOUNS = ['je','tu','il/elle/on','nous','vous','ils/elles'];
const IRREG_FEM = {
  'beau':'belle','nouveau':'nouvelle','vieux':'vieille',
  'blanc':'blanche','doux':'douce','faux':'fausse',
  'long':'longue','gros':'grosse','gentil':'gentille',
  'frais':'fraîche','roux':'rousse','favori':'favorite',
  'public':'publique','sec':'sèche','grec':'grecque'
};

const French = {
  conjugateER(inf) {
    const stem = inf.slice(0, -2);
    const isGer = inf.endsWith('ger');
    const isCer = inf.endsWith('cer');
    const endings = ['e','es','e','ons','ez','ent'];
    const forms = {};
    PRONOUNS.forEach((p, i) => {
      let s = stem;
      if (i === 3 && isGer) s = stem + 'e';
      if (i === 3 && isCer) s = stem.slice(0, -1) + 'ç';
      forms[p] = s + endings[i];
    });
    return forms;
  },

  pluralNoun(noun) {
    const n = noun.trim().toLowerCase();
    if (/[sxz]$/.test(n)) return n;
    if (/eau$/.test(n) || /au$/.test(n)) return n + 'x';
    if (n.endsWith('al')) return n.slice(0, -2) + 'aux';
    return n + 's';
  },

  feminizeAdj(adj) {
    const a = adj.trim().toLowerCase();
    if (IRREG_FEM[a]) return IRREG_FEM[a];
    if (a.endsWith('e') && !a.endsWith('é')) return a;
    if (a.endsWith('eux')) return a.slice(0, -3) + 'euse';
    if (a.endsWith('oux')) return a.slice(0, -3) + 'ouse';
    if (a.endsWith('if')) return a.slice(0, -2) + 'ive';
    if (a.endsWith('er')) return a.slice(0, -2) + 'ère';
    if (/(?:el|eil)$/.test(a)) return a + 'le';
    if (/(?:ien|en)$/.test(a)) return a + 'ne';
    if (a.endsWith('on')) return a + 'ne';
    if (a.endsWith('et')) return a + 'te';
    return a + 'e';
  },

  pluralAdj(adj) {
    const a = adj.trim().toLowerCase();
    if (/[sx]$/.test(a)) return a;
    if (a.endsWith('eau')) return a + 'x';
    if (a.endsWith('al')) return a.slice(0, -2) + 'aux';
    return a + 's';
  }
};

  if (!pw1 || pw1.length < 4) { S.error='Password must be at least 4 characters.'; render(); return; }
  if (pw1 !== pw2) { S.error='Passwords don\'t match.'; render(); return; }
  if (!pat || !pat.startsWith('github_pat_')) { S.error='Please enter a valid fine-grained PAT (starts with github_pat_).'; render(); return; }

  $('setup-btn').disabled = true;
  $('setup-btn').innerHTML = '<span class="spin"></span> Setting up...';

  try {
    const gh = new GH(pat);
    // Test the token by trying to read from the repo
    try { await gh.get('README.md'); } catch(e) { /* file may not exist, that's fine */ }

    const enc = await Cry.encrypt(pw1, pat);
    await gh.put('config.enc', JSON.stringify(enc), 'Setup: encrypted config');

    const prog = defaultProgress();
    prog.updated = new Date().toISOString();
    await gh.put('DRILL-PROGRESS.json', JSON.stringify(prog, null, 2), 'Setup: initial progress');

    localStorage.setItem('fd_token', pat);
    localStorage.setItem('fd_setup', '1');
    S.gh = gh;
    S.progress = prog;
    S.error = null;
    startAutoMode();
  } catch(e) {
    S.error = `Setup failed: ${e.message}. Check your PAT has Contents permission on ${CFG.owner}/${CFG.repo}.`;
    render();
  }
}

async function doLogin() {
  const pw = $('pw').value;
  S.error = null;
  if (!pw) { S.error = 'Enter your password.'; render(); return; }

  $('login-btn').disabled = true;
  $('login-btn').innerHTML = '<span class="spin"></span> Unlocking...';

  try {
    const gh = new GH(null);
    const raw = await gh.get('config.enc');
    if (!raw) { S.error = 'No config found in repo. Need to set up again.'; localStorage.removeItem('fd_setup'); S.screen = 'setup'; render(); return; }

    const bundle = JSON.parse(raw);
    let pat;
    try { pat = await Cry.decrypt(pw, bundle); } catch(e) { S.error = 'Wrong password.'; render(); return; }

    gh.token = pat;
    if ($('remember').checked) localStorage.setItem('fd_token', pat);

    const progRaw = await gh.get('DRILL-PROGRESS.json');
    const prog = progRaw ? migrateProgress(JSON.parse(progRaw)) : defaultProgress();

    S.gh = gh;
    S.progress = prog;
    S.error = null;
    startAutoMode();
  } catch(e) {
    S.error = `Login failed: ${e.message}`;
    render();
  }
}

/* ═══════════════════════════════════════════════════════════════
   AUTO-MODE — build queue, start drilling immediately
   ═══════════════════════════════════════════════════════════════ */

function startAutoMode() {
  if (!isHWDoneToday()) { startHWMode(); return; }
  if (!S.sessionStartTime) S.sessionStartTime = Date.now();
  const p = S.progress;
  const available = Object.entries(p.sections)
    .filter(([,s]) => s.status === 'locked' || s.status === 'learning')
    .map(([id]) => id);

  if (available.length === 0 || QUESTIONS.length === 0) {
    S.screen = 'done'; render(); return;
  }

  const pool = QUESTIONS.filter(q => available.includes(q.section));
  const a = p.answered || {};
  const now = Date.now();
  const dayMs = 86400000;

  const wrongWhy = [], wrongOther = [], unseen = [], stale = [];

  for (const q of pool) {
    const rec = a[q.id];
    if (!rec || !rec.attempts) { unseen.push(q); continue; }
    const last = rec.attempts[rec.attempts.length - 1];
    if (!last.ok) {
      if (rec.type === 'why') wrongWhy.push(q);
      else wrongOther.push(q);
      continue;
    }
    if (now - new Date(last.at).getTime() > dayMs) { stale.push(q); continue; }
  }

  Engine.shuffle(wrongWhy);
  Engine.shuffle(wrongOther);
  Engine.shuffle(unseen);
  Engine.shuffle(stale);

  const prodFirst = arr => {
    const prod = arr.filter(q => q.type === 'blank' || q.type === 'open');
    const recog = arr.filter(q => q.type === 'mcq' || q.type === 'why');
    return [...prod, ...recog];
  };

  const queue = [...wrongWhy, ...prodFirst(wrongOther), ...prodFirst(unseen), ...prodFirst(stale)];

  if (queue.length === 0) {
    S.screen = 'done'; render(); return;
  }

  S.queue = queue;
  S.qi = 0;
  S.answered = false;
  S.currentAnswer = null;
  S.sessionSeen = new Set();
  S.saveCounter = 0;
  S.screen = 'drill';
  render();
}

/* ═══════════════════════════════════════════════════════════════
   HW MODE — Sir Saif's daily homework
   ═══════════════════════════════════════════════════════════════ */

function getStreak() {
  if (!S.progress) return 0;
  var hw = S.progress.hw || {};
  var today = todayStr();
  var streak = 0;
  var d = new Date(today);
  if (hw[today] && hw[today].complete) { streak = 1; d.setDate(d.getDate() - 1); }
  else { d.setDate(d.getDate() - 1); }
  while (true) {
    var key = d.toISOString().slice(0, 10);
    if (hw[key] && hw[key].complete) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return streak;
}

function renderStreakBadge() {
  var streak = getStreak();
  if (streak === 0) return '';
  return '<div class="streak-badge">Day ' + streak + '</div>';
}

function renderHWHistory() {
  if (!S.progress || !S.progress.hw) return '';
  var hw = S.progress.hw;
  var days = Object.keys(hw).filter(function(k) { return hw[k].complete; }).sort().reverse().slice(0, 7);
  if (days.length === 0) return '';
  return '<div class="hw-history">' +
    '<div class="hw-history-title">Last ' + days.length + ' days</div>' +
    days.map(function(d) {
      var entry = hw[d];
      var score = entry.score || { total: 0, correct: 0 };
      var pct = score.total > 0 ? Math.round((score.correct / score.total) * 100) : 0;
      var color = pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--accent)' : 'var(--err)';
      var dateLabel = d.slice(5);
      return '<div class="hw-history-row">' +
        '<span class="hw-history-date">' + dateLabel + '</span>' +
        '<div class="hw-history-bar"><div class="hw-history-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<span class="hw-history-score" style="color:' + color + '">' + score.correct + '/' + score.total + '</span>' +
      '</div>';
    }).join('') +
  '</div>';
}

function formatDuration(ms) {
  var secs = Math.floor(ms / 1000);
  if (secs < 60) return secs + 's';
  var mins = Math.floor(secs / 60);
  secs = secs % 60;
  return mins + 'm ' + (secs < 10 ? '0' : '') + secs + 's';
}

function getHWLevel() {
  if (!S.progress || !S.progress.hw) return 0;
  return Object.values(S.progress.hw).filter(function(h) { return h.complete; }).length;
}

function pickHWSet(idx) {
  var set = HW_BANK[idx % HW_BANK.length];
  return {
    verbs: set.verbs.map(function(v) { return v.w; }),
    nouns: set.nouns.map(function(n) { return { w: n.w, g: n.g }; }),
    adjectives: set.adj.map(function(a) { return a.w; })
  };
}

function normApostrophe(s) {
  return s.replace(/[‘’ʼ`′]/g, "'");
}

function needsElision(conjugatedForm) {
  return /^[aeéèêëiîïoôuùûyh]/i.test(conjugatedForm);
}

function pronounLabel(pronoun, conjugatedForm) {
  if (pronoun === 'je' && needsElision(conjugatedForm)) return "j'";
  return pronoun;
}

let _hwActiveInput = null;

function insertCharHW(ch) {
  if (!_hwActiveInput || _hwActiveInput.disabled) return;
  const s = _hwActiveInput.selectionStart, e = _hwActiveInput.selectionEnd;
  _hwActiveInput.value = _hwActiveInput.value.slice(0, s) + ch + _hwActiveInput.value.slice(e);
  _hwActiveInput.selectionStart = _hwActiveInput.selectionEnd = s + 1;
  _hwActiveInput.focus();
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function isHWDoneToday() { return S.progress && S.progress.hw && S.progress.hw[todayStr()] && S.progress.hw[todayStr()].complete === true; }

function startHWMode() {
  const today = todayStr();
  const existing = S.progress && S.progress.hw && S.progress.hw[today];

  S.screen = 'hw';
  S.hwStep = 0;
  if (!S.sessionStartTime) S.sessionStartTime = Date.now();

  if (existing && !existing.complete && existing.words) {
    S.hwWords = existing.words;
    S.hwStep = existing.lastStep || 0;
    S.hwResults = existing.results || S.hwResults || { verbs: [], nouns: [], adjectives: [], sentences: [] };
    S.hwChecked = existing.checked || {};
    S.hwResponseCount = existing.responses || 0;
    S.hwStartTime = existing.startedAt || null;
    S.hwBankIdx = existing.bankIdx || 0;
  } else {
    S.hwBankIdx = getHWLevel() % HW_BANK.length;
    S.hwWords = pickHWSet(S.hwBankIdx);
    S.hwResults = { verbs: [], nouns: [], adjectives: [], sentences: [] };
    S.hwChecked = {};
    S.hwResponseCount = 0;
    S.hwStartTime = null;
  }

  render();
}

function renderHW() {
  if (S.hwStep === 0) return renderHWEntry();
  if (S.hwStep >= 1 && S.hwStep <= 3) return renderHWVerb(S.hwStep - 1);
  if (S.hwStep >= 4 && S.hwStep <= 6) return renderHWNoun(S.hwStep - 4);
  if (S.hwStep >= 7 && S.hwStep <= 9) return renderHWAdj(S.hwStep - 7);
  if (S.hwStep >= 10 && S.hwStep <= 12) return renderHWSentence(S.hwStep - 10);
  if (S.hwStep === 13) return renderHWSummary();
}

function renderHWDots() {
  const dots = [];
  for (let i = 1; i <= 12; i++) {

    dots.push('<div class="' + cls + '"></div>');

}

function checkHWVerb(idx) {
  if (!S.hwStartTime) S.hwStartTime = new Date().toISOString();
  S.hwResponseCount++;

  var verb = S.hwWords.verbs[idx];
  var correct = French.conjugateER(verb);
  var forms = {};
  var scoreCorrect = 0;

  PRONOUNS.forEach(function(p, i) {
    var typed = normApostrophe(($('conj' + i) ? $('conj' + i).value : '').trim().toLowerCase().normalize('NFC'));
    var rawForm = correct[p].normalize('NFC');
    var displayCorrect = correct[p];
    var ok = typed === rawForm;

    if (p === 'je' && needsElision(rawForm)) {
      var elided = ("j'" + rawForm).normalize('NFC');
      displayCorrect = "j'" + correct[p];
      if (typed === elided) ok = true;
    }

    if (ok) scoreCorrect++;
    forms[p] = { typed: typed, correct: displayCorrect, ok: ok };
  });

  S.hwChecked['v' + idx] = { forms: forms, score: { total: 6, correct: scoreCorrect } };
  S.hwResults.verbs[idx] = { word: verb, forms: forms, score: { total: 6, correct: scoreCorrect } };
  saveHWState();
  render();
}

function checkHWNoun(idx) {
  if (!S.hwStartTime) S.hwStartTime = new Date().toISOString();
  S.hwResponseCount++;

  var noun = S.hwWords.nouns[idx];
  var articleWord = noun.g === 'f' ? 'une' : 'un';
  var norm = function(s) { return normApostrophe(s.trim().toLowerCase().normalize('NFC').replace(/\s+/g, ' ')); };

  var typedArticle = norm($('noun-article') ? $('noun-article').value : '');
  var correctArticle = articleWord + ' ' + noun.w;
  var okArticle = typedArticle === norm(correctArticle);

  var typedPlural = norm($('noun-plural') ? $('noun-plural').value : '');

function checkHWSentence(idx) {
  if (!S.hwStartTime) S.hwStartTime = new Date().toISOString();
  S.hwResponseCount++;

  var set = HW_BANK[S.hwBankIdx % HW_BANK.length];
  var sentence = set.sentences[idx];
  var strip = function(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); };
  var norm = function(s) {
    return normApostrophe(s.trim().toLowerCase().normalize('NFC').replace(/\s+/g, ' ').replace(/[.!?,;…]+$/, ''));
  };
  var match = function(a, b) { return a === b || strip(a) === strip(b); };

  var typed = norm($('sentence-input') ? $('sentence-input').value : '');
  var expected = norm(sentence.fr);
  var ok = match(typed, expected);

  if (!ok && sentence.alt) {
    for (var ai = 0; ai < sentence.alt.length; ai++) {
      if (match(typed, norm(sentence.alt[ai]))) { ok = true; break; }
    }
  }

  S.hwChecked['s' + idx] = {
    typed: typed,
    correct: sentence.fr,
    ok: ok,
    score: { total: 1, correct: ok ? 1 : 0 }
  };
  S.hwResults.sentences[idx] = {
    en: sentence.en,
    typed: typed,
    correct: sentence.fr,
    ok: ok,
    score: { total: 1, correct: ok ? 1 : 0 }
  };
  saveHWState();
  render();
}

function generateHWMarkdown() {
  var set = HW_BANK[S.hwBankIdx % HW_BANK.length];
  var md = '';
  for (var i = 0; i < 3; i++) {
    var vc = S.hwChecked['v' + i];
    var verb = S.hwWords.verbs[i];
    var conj = French.conjugateER(verb);
    md += '### ' + verb + '\n\n';
    PRONOUNS.forEach(function(p, pi) {
      var lbl = pronounLabel(p, conj[p]);
      var val = vc && vc.forms[p] ? vc.forms[p].typed : '';
      md += '|' + lbl + '|' + (val || '') + '|\n';
      if (pi === 0) md += '|---|---|\n';
    });
    md += '\n';
  }
  for (var i = 0; i < 3; i++) {
    var nc = S.hwChecked['n' + i];
    var noun = S.hwWords.nouns[i];
    var gLabel = noun.g === 'f' ? 'feminine' : 'masculine';
    md += '### ' + noun.w + '\n\n';
    md += '|' + gLabel + '|' + (nc && nc.article ? nc.article.typed : '') + '|\n';
    md += '|---|---|\n';
    md += '|plural|' + (nc && nc.plural ? nc.plural.typed : '') + '|\n\n';
  }
  for (var i = 0; i < 3; i++) {
    var ac = S.hwChecked['a' + i];
    var adj = S.hwWords.adjectives[i];
    md += '### ' + adj + '\n\n';
    md += '|masculine|' + adj + '|\n';
    md += '|---|---|\n';
    md += '|feminine|' + (ac && ac.fem ? ac.fem.typed : '') + '|\n';
    md += '|masc. plural|' + (ac && ac.mascPl ? ac.mascPl.typed : '') + '|\n';
    md += '|fem. plural|' + (ac && ac.femPl ? ac.femPl.typed : '') + '|\n\n';
  }
  if (set.sentences) {
    md += '### Sentences\n\n';
    md += '|English|French|\n|---|---|\n';
    set.sentences.forEach(function(s, si) {
      var sc = S.hwChecked['s' + si];
      md += '|' + s.en + '|' + (sc ? sc.typed : '') + '|\n';
    });
    md += '\n';
  }
  return md;
}

function downloadHWFile() {
  var md = generateHWMarkdown();
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var d = new Date();
  var name = 'Homework ' + (getHWLevel()) + ' (' + months[d.getMonth()] + ' ' + d.getDate() + ').md';
  var blob = new Blob([md], { type: 'text/markdown' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saveHWState() {
  var today = todayStr();
  if (!S.progress.hw) S.progress.hw = {};
  S.progress.hw[today] = {
    startedAt: S.hwStartTime,
    completedAt: null,
    responses: S.hwResponseCount,
    words: S.hwWords,
    results: S.hwResults,
    checked: S.hwChecked,
    lastStep: S.hwStep,
    bankIdx: S.hwBankIdx,
    complete: false
  };

}

function completeHW() {
  var today = todayStr();
  if (!S.progress.hw) S.progress.hw = {};
  var hw = S.progress.hw[today] || {};
  hw.completedAt = new Date().toISOString();
  hw.complete = true;
  hw.startedAt = S.hwStartTime;
  hw.responses = S.hwResponseCount;
  hw.words = S.hwWords;
  hw.results = S.hwResults;
  hw.checked = S.hwChecked;

  var total = 0, correct = 0;
  for (var i = 0; i < 3; i++) {
    var vc = S.hwChecked['v' + i]; if (vc) { total += vc.score.total; correct += vc.score.correct; }
    var nc = S.hwChecked['n' + i]; if (nc) { total += nc.score.total; correct += nc.score.correct; }
    var ac = S.hwChecked['a' + i]; if (ac) { total += ac.score.total; correct += ac.score.correct; }
    var sc = S.hwChecked['s' + i]; if (sc) { total += sc.score.total; correct += sc.score.correct; }
  }
  hw.score = { total: total, correct: correct };
  S.progress.hw[today] = hw;
  localStorage.setItem('fd_progress', JSON.stringify(S.progress));
  syncToGitHub();

  const pct = masteryPct();

  let qHTML = '';
  if (q.type === 'mcq' || q.type === 'why') qHTML = renderMCQ(q);
  else if (q.type === 'blank') qHTML = renderBlank(q);
  else if (q.type === 'open') qHTML = renderOpen(q);

  app().innerHTML = `
    <div class="dp">
      <div class="dp-top">
        <div class="row between" style="margin-bottom:.5rem">
          <span class="dp-count">${S.qi + 1} / ${S.queue.length}</span>

      </div>
      <div class="dp-body">
        ${qHTML}
      </div>
    </div>`;

  bindEvents(q);
}

function renderMCQ(q) {
  const a = S.currentAnswer;
  const ans = S.answered;
  const letters = ['A','B','C'];
  return `
    <div class="card card-accent${ans ? (a.correct ? ' card-ok' : ' card-err') : ''}" id="q-card">
      <div class="serif">${esc(q.stem)}</div>
      ${q.context ? `<div class="sub mt-sm">${esc(q.context)}</div>` : ''}
      <div class="opts" id="opts">
        ${q.options.map((o, i) => {
          let cls = 'opt';
          if (ans) {
            cls += ' opt-locked';
            if (i === q.correct) cls += ' opt-right';
            else if (a && a.selected === i) cls += ' opt-wrong';
          }
          return `<button class="${cls}" data-idx="${i}"><span class="opt-letter">${letters[i]}</span><span>${esc(o)}</span></button>`;
        }).join('')}
      </div>
      ${ans ? `
        <div class="fb ${a.correct ? 'fb-ok' : 'fb-err'}">
          <span class="fb-head">${a.correct ? 'Correct !' : 'Pas tout à fait.'}</span>
          ${!a.correct ? `<span class="fb-answer">${esc(q.options[q.correct])}</span>` : ''}
          <span class="fb-rule">${esc(q.rule)}</span>
        </div>
        <button class="btn btn-p mt" id="next-btn">Suivant →</button>
      ` : ''}
    </div>`;
}

function renderBlank(q) {
  const a = S.currentAnswer;
  const ans = S.answered;
  return `
    <div class="card card-accent${ans ? (a.correct ? ' card-ok' : ' card-err') : ''}" id="q-card">
      <div class="serif">${esc(q.stem)}</div>
      ${q.context ? `<div class="sub mt-sm">${esc(q.context)}</div>` : ''}
      <div class="mt">
        <input type="text" class="field${ans ? (a.correct ? ' field-ok' : ' field-err') : ''}" id="inp"
          placeholder="Votre réponse…" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
          value="${ans ? esc(a.typed) : ''}" ${ans ? 'disabled' : ''}>
      </div>
      <div class="center"><button class="keys-toggle" id="keys-toggle" ${ans ? 'style="display:none"' : ''}>accents ↑</button></div>
      <div class="keys" id="keys">
        ${ACCENTS.map(c => `<button class="key" data-c="${c}" ${ans ? 'disabled' : ''}>${c}</button>`).join('')}
      </div>
      ${!ans ? '<button class="btn btn-p" id="check-btn">Vérifier</button>' : ''}
      ${ans ? `
        <div class="fb ${a.correct ? 'fb-ok' : 'fb-err'}">
          <span class="fb-head">${a.correct ? 'Correct !' : 'Pas tout à fait.'}</span>
          ${!a.correct ? `<span class="fb-answer">${esc(q.correct)}</span>` : ''}
          <span class="fb-rule">${esc(q.rule)}</span>
        </div>
        <button class="btn btn-p mt" id="next-btn">Suivant →</button>
      ` : ''}
    </div>`;
}

function renderOpen(q) {
  const a = S.currentAnswer;
  const ans = S.answered;
  const hintHtml = q.hints ? esc(q.hints).replace(/\.\s+(?=[A-Z])/g, '.<br>') : '';
  return `
    <div class="card card-accent${ans ? (a.correct ? ' card-ok' : ' card-err') : ''}" id="q-card">
      <div class="serif">${esc(q.stem)}</div>
      ${q.context ? `<div class="sub mt-sm">${esc(q.context)}</div>` : ''}
      ${hintHtml ? `<div class="sub mt-sm">${hintHtml}</div>` : ''}
      <div class="mt">
        <input type="text" class="field${ans ? (a.correct ? ' field-ok' : ' field-err') : ''}" id="inp"
          placeholder="Votre réponse…" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
          value="${ans ? esc(a.typed) : ''}" ${ans ? 'disabled' : ''}>
      </div>
      <div class="center"><button class="keys-toggle" id="keys-toggle" ${ans ? 'style="display:none"' : ''}>accents ↑</button></div>
      <div class="keys" id="keys">
        ${ACCENTS.map(c => `<button class="key" data-c="${c}" ${ans ? 'disabled' : ''}>${c}</button>`).join('')}
      </div>
      ${!ans ? '<button class="btn btn-p" id="check-btn">Vérifier</button>' : ''}
      ${ans ? `
        <div class="fb ${a.correct ? 'fb-ok' : 'fb-err'}">
          <span class="fb-head">${a.correct ? 'Correct !' : 'Pas tout à fait.'}</span>
          ${!a.correct ? `<span class="fb-answer">${esc(q.correct)}</span>` : ''}
          <span class="fb-rule">${esc(q.rule)}</span>
        </div>
        <button class="btn btn-p mt" id="next-btn">Suivant →</button>
      ` : ''}
    </div>`;
}

function bindEvents(q) {
  if (_advanceListener) { document.removeEventListener('keydown', _advanceListener); _advanceListener = null; }

  if (S.answered) {
    const next = $('next-btn');
    if (next) next.onclick = goNext;
    setTimeout(() => {
      _advanceListener = function(e) {
        if (e.key === 'Enter') { document.removeEventListener('keydown', _advanceListener); _advanceListener = null; goNext(); }
      };
      document.addEventListener('keydown', _advanceListener);
    }, 200);
    const card = $('q-card');
    if (S.currentAnswer?.correct) card?.classList.add('pop');
    else card?.classList.add('shake');
    return;
  }

  if (q.type === 'mcq' || q.type === 'why') {
    document.querySelectorAll('.opt').forEach(btn => {
      btn.onclick = () => {
        const sel = parseInt(btn.dataset.idx);
        submitAnswer(q, { selected: sel, correct: sel === q.correct });
      };
    });
  } else {
    const inp = $('inp');
    if (inp) setTimeout(() => inp.focus(), 60);
    const toggle = $('keys-toggle');
    const keysEl = $('keys');
    if (toggle && keysEl) {
      toggle.onclick = () => {
        const open = keysEl.style.display === 'none';
        keysEl.style.display = open ? 'flex' : 'none';
        toggle.textContent = open ? 'accents ↑' : 'accents ↓';
      };
    }
    document.querySelectorAll('.key').forEach(k => {
      k.addEventListener('mousedown', e => e.preventDefault());
      k.onclick = () => insertChar(k.dataset.c);
    });
    const doCheck = () => {
      const v = inp?.value?.trim();
      if (!v) { inp?.focus(); return; }
      submitAnswer(q, { typed: v, correct: Engine.check(q, v) });
    };
    const cb = $('check-btn');
    if (cb) cb.onclick = doCheck;
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') doCheck(); });
  }
}

function insertChar(ch) {
  const el = $('inp');
  if (!el || el.disabled) return;
  const s = el.selectionStart, e = el.selectionEnd;
  el.value = el.value.slice(0, s) + ch + el.value.slice(e);
  el.selectionStart = el.selectionEnd = s + 1;
  el.focus();
}

function sessionAccuracy() {
  const seen = S.sessionSeen;
  if (!seen || seen.size === 0) return { total: 0, correct: 0, pct: '' };
  const total = seen.size;
  let correct = 0;
  for (const id of seen) {
    const rec = S.progress.answered?.[id];
    if (rec?.attempts?.length && rec.attempts[rec.attempts.length - 1].ok) correct++;
  }
  return { total, correct, pct: Math.round((correct / total) * 100) + '%' };
}

function submitAnswer(q, answer) {
  S.answered = true;
  S.currentAnswer = answer;
  S.sessionSeen.add(q.id);
  recordAnswer(q, answer);
  render();
}

function recordAnswer(q, answer) {
  const p = S.progress;
  const now = new Date().toISOString();
  const today = now.slice(0, 10);
  p.updated = now;
  p.stats.questions++;
  if (answer.correct) p.stats.correct++;

  if (p.stats.lastDate !== today) {
    if (p.stats.lastDate) {
      const diff = Math.floor((new Date(today) - new Date(p.stats.lastDate)) / 86400000);
      p.stats.streak = diff <= 1 ? p.stats.streak + 1 : 1;
    } else { p.stats.streak = 1; }
    p.stats.lastDate = today;
    if (p.stats.streak > p.stats.best) p.stats.best = p.stats.streak;
  }

  const sec = p.sections[q.section];
  if (sec) { sec.lastReview = now; sec.reviews++; }

  if (!p.answered) p.answered = {};
  const youSaid = answer.typed != null ? answer.typed : (q.options ? q.options[answer.selected] : '?');
  const entry = p.answered[q.id];
  if (!entry) {
    p.answered[q.id] = {
      type: q.type,
      section: q.section,
      ans: q.type === 'mcq' || q.type === 'why' ? q.options[q.correct] : q.correct,
      attempts: [{ ok: answer.correct, at: now, you: youSaid }]
    };
  } else {
    entry.attempts.push({ ok: answer.correct, at: now, you: youSaid });
    if (entry.attempts.length > 20) entry.attempts = entry.attempts.slice(-20);
  }

  localStorage.setItem('fd_progress', JSON.stringify(p));

  S.saveCounter++;
  if (S.saveCounter % 5 === 0) syncToGitHub();
}

async function syncToGitHub() {
  if (!S.gh) return;
  try {
    await S.gh.put('DRILL-PROGRESS.json', JSON.stringify(S.progress, null, 2),
      `Drill sync — ${S.progress.stats.questions} total`);
  } catch(e) { console.error('Sync failed:', e); }
}

function goNext() {
  if (S.currentAnswer && !S.currentAnswer.correct) {
    const gap = 5 + Math.floor(Math.random() * 6);
    const reinsertAt = Math.min(S.qi + gap, S.queue.length);
    S.queue.splice(reinsertAt, 0, S.queue[S.qi]);
  }
  S.qi++;
  S.answered = false;
  S.currentAnswer = null;
  if (S.qi >= S.queue.length) {
    syncToGitHub();
    S.screen = 'done';
  }
  render();
}

function renderDone() {
  const { total, correct } = sessionAccuracy();
  const acc = total > 0 ? Math.round((correct / total) * 100) : 0;
  let msg = 'Parfait !';
  if (acc < 50) msg = 'Il faut réviser.';
  else if (acc < 80) msg = 'Pas mal — continue !';
  else if (acc < 100) msg = 'Bien joué !';
  const durationStr = S.sessionStartTime ? formatDuration(Date.now() - S.sessionStartTime) : '';
  const stats = S.progress ? S.progress.stats : {};

  app().innerHTML = `
    <div class="dp">
      <div class="dp-body center">
        <div style="margin-top:auto"></div>
        ${renderStreakBadge()}
        <div class="res-score" style="color:var(--accent);margin-top:.75rem">${correct} / ${total}</div>
        <div class="res-msg" style="font-size:1.25rem">${total > 0 ? msg : 'All caught up.'}</div>
        ${durationStr ? `<p class="sub">${durationStr} today</p>` : ''}
        <p class="sub" style="margin-bottom:1.5rem">${stats.questions || 0} lifetime questions &middot; ${stats.correct || 0} correct</p>
        <div class="col" style="gap:1rem">
          <button class="btn btn-p" id="again-btn" style="border-radius:12px;padding:1rem">Start Over (Shuffled)</button>
          <button class="btn btn-g" id="lock-btn" style="border-radius:12px;padding:1rem">Lock</button>
        </div>
        <div style="margin-top:auto"></div>
      </div>
    </div>`;
  $('again-btn').onclick = startAutoMode;
  $('lock-btn').onclick = () => { localStorage.removeItem('fd_token'); S.gh=null; S.progress=null; S.screen='login'; S.error=null; render(); };
}

window.addEventListener('beforeunload', () => {
  if (S.progress) {
    localStorage.setItem('fd_progress', JSON.stringify(S.progress));
    if (S.gh && S.saveCounter > 0) {
      navigator.sendBeacon?.(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/DRILL-PROGRESS.json`);
    }
  }
});


/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */

async function init() {
  const storedToken = localStorage.getItem('fd_token');
  if (storedToken) {
    try {
      const gh = new GH(storedToken);
      const raw = await gh.get('DRILL-PROGRESS.json');
      S.gh = gh;
      S.progress = raw ? migrateProgress(JSON.parse(raw)) : defaultProgress();
      const local = localStorage.getItem('fd_progress');
      if (local) {
        const lp = migrateProgress(JSON.parse(local));
        if (lp.updated && (!S.progress.updated || lp.updated > S.progress.updated)) S.progress = lp;
      }
      startAutoMode();
      return;
    } catch(e) { localStorage.removeItem('fd_token'); }
  }

  const hasSetup = localStorage.getItem('fd_setup');
  if (hasSetup) { S.screen = 'login'; }
  else {
    try {
      const gh = new GH(null);
      const raw = await gh.get('config.enc');
      S.screen = raw ? 'login' : 'setup';
    } catch(e) { S.screen = 'setup'; }
  }
  render();
}

init();
</script>
